name: crm_app
version: "1.0.0"
execution_mode: trusted
entry_point: src/main.py
permissions:
  - resource: "*"
    actions: ["execute"]
    effect: allow

# Bloc libre (docs/spec-v1.md §2.1) : non typé dans manifest_schema.json,
# capturé tel quel par PluginManifest dans `.extra` -> PluginContext.config.
ui:
  mode: xui
