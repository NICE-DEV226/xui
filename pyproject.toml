[project]
name = "xui"
version = "0.1.0"
description = "SDK de pages server-rendues pour plugins xcore — jamais un prerequis, jamais une couche kernel."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "httpx>=0.27",
    "microframe",
    "xcoreruntime[all]",
]

[project.optional-dependencies]
# xcore n'est requis que pour mount_xui_page (résolution de l'utilisateur) —
# le reste du SDK (composants, CSRF, forms, mounts statics) s'importe sans lui.
xcore = ["xcoreruntime>=2.5.2"]

[dependency-groups]
# `uv sync` seul installe ce groupe par défaut — plus besoin de réinstaller
# pytest à la main à chaque venv frais (vécu deux fois dans ce repo).
# xcoreruntime/microframe sont déjà des dépendances directes ci-dessus.
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# microframe (le vrai moteur Jinja2, https://github.com/traoreera/microframe)
# n'est PAS ce paquet : "microframe" sur PyPI est un projet numpy sans rapport
# (collision de nom). Installer le vrai en editable depuis le sibling repo :
#   uv pip install -e ../microframe

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xui*"]

[tool.setuptools.package-data]
xui = [
    "components/*.html",
    "components/*/*.html",
    "components/NOTICE.md",
    "static/*.js",
    "static/cotton-ui/*",
    "static/alpine/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
microframe = { git = "https://github.com/traoreera/microframe.git" }

