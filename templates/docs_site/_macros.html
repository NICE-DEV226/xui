{% macro example(title) %}
<div class="mb-8">
  <h3 class="text-sm font-medium text-ink-500 mb-2">{{ title }}</h3>
  <div class="border border-ink-200 dark:border-ink-800 rounded-box p-6 mb-2">
    {{ caller() }}
  </div>
</div>
{% endmacro %}

{% macro snippet(code) %}
<pre class="bg-ink-900 text-ink-100 rounded-control p-4 text-xs overflow-x-auto mb-8"><code>{{ code }}</code></pre>
{% endmacro %}
