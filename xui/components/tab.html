{# Porté depuis django-cotton-ui (MIT, Will Abbott). Panneau d'onglet : il
   s'enregistre dans le `x-data` du `<ui.tabs>` parent via `register()`.
   `name` est un identifiant simple (pas de quote) — c'est ce bleu qu'Alpine
   utilise pour basculer l'onglet. #}
{% uivars name="" icon="" class="" %}
<div x-init="register('{{ name }}', '{{ icon }}')"
     x-show="isActive('{{ name }}')"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-1"
     x-transition:enter-end="opacity-100 translate-y-0"
     style="display: none;"
     role="tabpanel"
     tabindex="0"
     class="mt-2"
     {{ attrs }}>
    {{ slot }}
</div>
